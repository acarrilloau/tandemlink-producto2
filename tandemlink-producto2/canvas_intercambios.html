<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Tarjetas - TandemLink</title>
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS General del Proyecto -->
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="bg-light">

        <!-- Navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                TandemLink
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Mostrar navegación"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Iniciar sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nueva-oferta.html">Intercambios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="usuarios.html">Usuarios</a>
                    </li>
               <!-- Enlaces añadidos para los nuevos módulos del Producto 2 -->
                    <li class="nav-item">
                        <a class="nav-link active" href="canvas_intercambios.html">Generador Canvas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dragdrop.html">Favoritos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container my-5">
       <header class="mx-auto text-center mb-5">
            <h1 class="fw-bold mb-2">Generador de Insignias</h1>
            <p class="lead">Crea y descarga tarjetas gráficas dinámicas de tus intercambios utilizando la API de Canvas.</p>
        </header>
        <!-- Formulario de selección -->
        <div class="card p-4 shadow-sm mb-4">
            <div class="mb-3">
                <label for="selectIntercambioCanvas" class="form-label">Selecciona un intercambio:</label>
                <select id="selectIntercambioCanvas" class="form-select">
                    <!-- Se rellenará dinámicamente desde JavaScript -->
                </select>
            </div>
            <button id="btnGenerarCanvas" class="btn btn-primary">Generar Tarjeta Gráfica</button>
        </div>

        <!-- Contenedor del Canvas y botón de descarga -->
        <div class="text-center">
            <canvas id="miCanvas" class="border shadow-sm mb-3 bg-white"></canvas>
            <div>
                <a id="btnDescargarCanvas" class="btn btn-success" style="display: none;">Descargar Imagen PNG</a>
            </div>
        </div>

        <!-- Mensajes de alerta -->
        <div id="mensajeCanvas"></div>
    </div>

    <!-- Script principal como módulo -->
    <script type="module" src="./js/canvas_intercambios.js"></script>
</body>
</html>
