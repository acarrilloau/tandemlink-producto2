
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TandemLink - Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TandemLink</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="intercambios.html">Intercambios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuarios</a></li>
                </ul>

                <span class="navbar-text ms-lg-3" id="usuarioActivo">
                    -no login-
                </span>

                <button id="cerrarSesion" class="btn btn-outline-light btn-sm ms-3" hidden>
                    Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <h1 class="section-title mb-4">Gestión de usuarios</h1>

        <div class="card shadow-sm border-0 p-4 mb-5">
            <h2 class="h4 mb-3" id="tituloFormularioUsuario">
                Registrar nuevo usuario
            </h2>

            <form id="formularioUsuario">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        required
                        placeholder="Introduce el nombre">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        required
                        placeholder="Introduce el correo">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        required
                        minlength="6"
                        placeholder="Introduce una contraseña">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" id="botonGuardarUsuario">
                        Registrar usuario
                    </button>

                    <button type="button" class="btn btn-secondary" id="cancelarEdicion" hidden>
                        Cancelar
                    </button>
                </div>

                <p id="mensajeUsuario" class="mt-3 mb-0"></p>

            </form>
        </div>

        <section>
            <h2 class="section-title mb-3">Usuarios registrados</h2>

            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle bg-white">
                    <thead class="table-primary">
                        <tr>
                            <th>Nombre</th>
                            <th>Correo electrónico</th>
                            <th>Contraseña</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaUsuarios">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="footer">
        TandemLink · Proyecto educativo de intercambio de idiomas
    </footer>

    <script type="module" src="js/usuarios.js"></script>
    <script type="module" src="js/navegacion.js"></script>

</body>
</html>
