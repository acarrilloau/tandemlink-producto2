
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TandemLink - Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">TandemLink</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="intercambios.html">Intercambios</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuarios</a></li>
                </ul>

                <span class="navbar-text ms-lg-3" id="usuarioActivo">
                    -no login-
                </span>

                <button id="cerrarSesion" class="btn btn-outline-light btn-sm ms-3" hidden>
                    Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm border-0 p-4">
                    <h1 class="section-title text-center mb-4">
                        Iniciar sesión
                    </h1>

                    <form id="formularioLogin">

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                required
                                placeholder="Introduce tu correo">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                required
                                placeholder="Introduce tu contraseña">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Entrar
                        </button>

                        <p id="mensajeLogin" class="mt-3 text-center"></p>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="footer">
        TandemLink · Proyecto educativo de intercambio de idiomas
    </footer>

    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/navegacion.js"></script>

</body>
</html>
